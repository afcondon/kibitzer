<svg xmlns="http://www.w3.org/2000/svg" viewBox="-360 -235 720 470" role="img" aria-label="the watcher">
  <!-- the trailer eye, adapted for a light ground: the almond is outlined
       (it was paper-filled for the dark title sequence), the faint rings
       are dropped. Still, calm — no animation. -->
