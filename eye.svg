        fill="#f4f1ea" stroke="#141414" stroke-width="7"/>
  <circle r="100" fill="#d92b2b"/>
  <circle r="86" fill="none" stroke="#141414" stroke-width="5" opacity=".55"/>
  <circle r="64" fill="none" stroke="#141414" stroke-width="5" opacity=".55"/>
  <circle r="40" fill="#141414"/>
</svg>
